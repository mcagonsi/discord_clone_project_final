<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"

      xmlns:ui="jakarta.faces.facelets">
   <h:head>
        <title>Discord by Juggernaut</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
       <meta icon="/resources/images/favicon.ico" />
       <link rel="icon" type="image" href="/resources/images/juggernaut.png" />
      <link rel="shortcut icon" type="image" href="/resources/images/juggernaut.png" />
        <h:outputStylesheet library="css" name="theme.css" />

    <h:body>
        <div class="app-bg flex items-center justify-center px-4 py-8">

                    <p class="text-gray-300 text-sm"> Welcome from Team Juggernaut</p>

                <div class="mt-6 text-center text-gray-400 text-xs">
