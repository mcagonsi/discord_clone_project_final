<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:form id="serverRailForm">
    <div id="serverRail" class="w-full gap-3 h-full flex flex-col items-center">
      <h:commandButton
        action="#{dashboardNavigation.toggleSideBarPanel('DMs')}"
        value="DMs"
        styleClass="w-full h-10 bg-gray-700 hover:bg-gray-600 text-white rounded-lg">
        <f:ajax execute="@this" render=":sideNav" />
      </h:commandButton>

      <hr class="w-full h-0.5 bg-gray-600" />

      <ui:repeat value="#{dashboardNavigation.getServers()}" var="s">
        <h:commandButton
          action="#{dashboardNavigation.toggleSideBarPanel('server')}"
          actionListener="#{dashboardNavigation.selectServer(s)}"
          value="#{s}"
          styleClass="w-full h-10 bg-gray-700 hover:bg-gray-600 text-white rounded-lg">
          <f:ajax execute="@this" render=":sideNav" />
        </h:commandButton>
      </ui:repeat>
    </div>
  </h:form>
</ui:composition>
