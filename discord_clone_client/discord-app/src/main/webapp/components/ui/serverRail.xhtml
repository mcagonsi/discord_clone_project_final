<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:form id="serverRailForm">
    <h:panelGroup
      id="serverRail"
      styleClass="w-full gap-3 px-2 h-full flex flex-col items-center"
    >
      <h:commandButton
        action="#{dashboardNavigation.toggleSideBarPanel('DMs')}"
        value="DMs"
        styleClass="w-full h-10 bg-red-700 hover:bg-red-500 text-white font-bold rounded-md"
      >
        <f:ajax execute="@this" render=":sideNav" />
      </h:commandButton>

      <hr class="w-full border-b border-red-800 p-2" />

      <h:panelGroup layout="block">
        <f:event
          type="preRenderComponent"
          listener="#{serverBean.fetchJoinedServers}"
        />

        <ui:repeat value="#{serverBean.joinedServersList}" var="server">
          <h:commandButton
            value="#{server.name}"
            action="#{dashboardNavigation.toggleSelectedServer(server.id)}"
            styleClass="w-full h-10 bg-gray-700 hover:bg-blue-600 text-white rounded-md"
          >
            <f:ajax execute="@this" render=":sideNav" />
          </h:commandButton>
        </ui:repeat>
      </h:panelGroup>
    </h:panelGroup>
  </h:form>
</ui:composition>
