<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <div class="w-full">
    <h:form id="composerForm" enctype="multipart/form-data">
      <div
        class="flex flex-row items-start gap-3 p-3 rounded-md bg-gray-900/70 border border-gray-800 shadow-lg"
      >
        <!-- Attach button + file input -->
        <label
          class="flex items-center justify-center w-10 h-10 rounded-lg bg-indigo-600 hover:bg-indigo-700 cursor-pointer text-metal"
        >
          <span class="text-2xl font-semibold">+</span>
          <h:inputFile
            value="#{directChatBean.attachmentFile}"
            id="fileInput"
            styleClass="hidden"
          />
        </label>

        <!-- Message input -->
        <h:inputTextarea
          id="chatbox"
          placeholder="Type message..."
          style="height: fit-content"
          value="#{directChatBean.messageContent}"
          styleClass="flex-1 bg-black/70 border border-gray-700 rounded-lg text-white placeholder-gray-500 px-4 py-3 focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/30 transition"
        />
        <h:commandButton
          value="Send"
          action="#{directChatBean.sendDirectChatMessage}"
          styleClass="w-[150px] h-10 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg mt-2"
        >
          <f:ajax execute="@form" render=":chatPanelView @form " />
        </h:commandButton>
      </div>
    </h:form>
  </div>
</ui:composition>
