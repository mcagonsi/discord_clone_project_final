<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <div>
    <ul>
      <li>
        Friends List->have its own panel to show friends and send friend invite
      </li>
      <li>Block User</li>
      <li>Create Server</li>
      <li>Search for Servers</li>
      <li>Join a Private Server(with invite link)paste and join</li>
    </ul>
    <h:form>
      <ui:repeat value="#{dashboard.getDirectMessages()}" var="m">
        <h:commandButton
          action="#{dashboard.toggleServerRailOption('DMs')}"
          value="#{m}"
          styleClass="w-full h-10 bg-gray-700 hover:bg-gray-600 text-white rounded-lg"
        >
        <f:ajax execute="@this" render=":sideNav" />
        </h:commandButton>
      </ui:repeat>
    </h:form>
  </div>
</ui:composition>
