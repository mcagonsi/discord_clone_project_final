<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <div>
    <div class="flex flex-col gap-3 mb-2">
      <span class="text-sm text-gray-400 uppercase">User Options</span>
      <h:form>
        <h:commandButton
          action="#{dashboardNavigation.toggleMainContentPanel('friendsPanel')}"
          value="Friends List"
          styleClass="w-full h-10 bg-gray-700 hover:bg-red-600 text-white rounded-lg"
        >
          <f:ajax execute="@this" render=":mainContentPanel" />
        </h:commandButton>

        <h:commandButton
          action="#{dashboardNavigation.toggleMainContentPanel('blockPanel')}"
          value="Block User"
          styleClass="w-full h-10 bg-gray-700 hover:bg-red-600 text-white rounded-lg mt-2"
        >
          <f:ajax execute="@this" render=":mainContentPanel" />
        </h:commandButton>

        <h:commandButton
          action="#{dashboardNavigation.toggleMainContentPanel('createServerPanel')}"
          value="Create Server"
          styleClass="w-full h-10 bg-gray-700 hover:bg-red-600 text-white rounded-lg mt-2"
        >
          <f:ajax execute="@this" render=":mainContentPanel" />
        </h:commandButton>

        <h:commandButton
          action="#{dashboardNavigation.toggleMainContentPanel('searchServersPanel')}"
          value="Search for Servers"
          styleClass="w-full h-10 bg-gray-700 hover:bg-red-600 text-white rounded-lg mt-2"
        >
          <f:ajax execute="@this" render=":mainContentPanel" />
        </h:commandButton>

        <h:commandButton
          action="#{dashboardNavigation.toggleMainContentPanel('joinServerPanel')}"
          value="Join a Private Server"
          styleClass="w-full h-10 bg-gray-700 hover:bg-red-600 text-white rounded-lg mt-2"
        >
          <f:ajax execute="@this" render=":mainContentPanel" />
        </h:commandButton>
      </h:form>
    </div>
    <hr class="border-gray-600 my-2" />
    <h:form>
      <div class="flex flex-col gap-3">
        <h:panelGroup layout="block">
          <f:event
            type="preRenderComponent"
            listener="#{directChatBean.loadUsersDirectChats}"
          />
          <h:outputText
            value="Direct Messages"
            styleClass="text-sm text-gray-400 uppercase"
          />
          <ui:repeat value="#{directChatBean.userDirectChats}" var="dc">
            <h:commandButton
              action="#{dashboardNavigation.toggleDirectChat(dc.key)}"
              value="#{dc.value.username}"
              styleClass="w-full h-10 bg-blue-700 hover:bg-gray-800 text-white rounded-md"
            >
              <f:ajax execute="@this" render=":mainContentPanel" />
            </h:commandButton>
          </ui:repeat>
        </h:panelGroup>
      </div>
    </h:form>
  </div>
</ui:composition>
