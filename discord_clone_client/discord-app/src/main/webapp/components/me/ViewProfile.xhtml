<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:form id="profileForm">
        <div class="relative inline-block text-left">

            <h:commandButton
                id="profileToggleBtn"
                value="#{sessionedUser.display_name}"
                action="#{dashboardNavigation.toggleShowProfile}"
                styleClass="inline-flex items-center rounded-md px-3 py-2 text-sm font-medium text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-red-600 transition">
                <f:ajax execute="@this" render="profilePanel" />
            </h:commandButton>

            <h:panelGroup id="profilePanel" layout="block" styleClass="absolute right-0 mt-2 w-80 z-50">
                <ui:fragment rendered="#{dashboardNavigation.showProfile}">
                    <div class="rounded-xl border border-gray-700 bg-gray-900 shadow-lg p-4 space-y-4">
                        <ui:include src="ProfileInfo.xhtml" />

                        <div class="border-t border-gray-700 pt-4">
                            <h:commandButton
                                value="Logout"
                                action="#{authBean.logOut}"
                                styleClass="w-full rounded-md bg-red-600 px-4 py-2 text-sm font-semibold text-white hover:bg-red-700 transition" />
                        </div>
                    </div>
                </ui:fragment>
            </h:panelGroup>

        </div>
    </h:form>
</ui:composition>
