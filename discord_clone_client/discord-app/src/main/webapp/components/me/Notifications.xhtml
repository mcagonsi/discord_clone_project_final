<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:form id="notifications">
    <div class="relative inline-block text-left">
      <h:commandButton
        id="notificationsToggleBtn"
        value="Notifications"
        action="#{dashboardNavigation.toggleShowNotifications}"
        styleClass="inline-flex items-center rounded-md px-3 py-2 text-sm font-medium text-white hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-red-600 transition"
      >
        <f:ajax execute="@this" render="notificationsPanel" />
      </h:commandButton>

      <h:panelGroup
        id="notificationsPanel"
        layout="block"
        styleClass="absolute right-0 mt-2 w-300 h-full z-50"
      >
        <ui:fragment rendered="#{dashboardNavigation.showNotifications}">
          <div
            class="rounded-xl border border-gray-700 bg-gray-900 shadow-lg p-4 space-y-4"
          >
            <p>Notification 1</p>
            <p>Notification 2</p>
            <p>Notification 3</p>
          </div>
        </ui:fragment>
      </h:panelGroup>
    </div>
  </h:form>
</ui:composition>
