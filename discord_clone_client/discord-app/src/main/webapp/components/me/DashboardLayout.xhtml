<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <div class="flex flex-row h-full w-full min-h-0 overflow-hidden">
    <!-- Server Rail -->
    <div class="w-16 bg-gray-900 flex flex-col h-full min-h-0">
      <ui:insert name="serverRail" />
      sidebar for icons
    </div>

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-800 flex flex-col h-full min-h-0">
      <ui:insert name="sideNav" />
      side navigation
    </aside>

    <!-- Main -->
    <main class="flex-1 flex flex-col h-full min-h-0">
      <!-- Top Bar -->
      <header class="h-10 border-b border-gray-700 flex items-center px-4">
        <ui:insert name="titleBar" />
        Title bar shows who you chat with or what channel you're in
      </header>

      <!-- this section covers the chat and showing members info or receiver info -->
      <section class="flex-1 flex overflow-hidden min-h-0">
        <!-- Main Content -->
        <div class="flex-1 min-h-0 flex flex-col">
          <!-- Scrollable chat area -->
          <div id="chatContent" class="flex-1 min-h-0 w-full overflow-y-auto px-4 py-4 space-y-4">
            <ui:insert name="content" />
            chat contents show here
          </div>

          <!-- Chat input stays at the bottom of this column -->
          <div id="chatInputContainer" class="shrink-0 w-full border-t border-gray-800 bg-black">
            <ui:include src="/components/ui/chatInput.xhtml" />
          </div>
        </div>

        <!-- Members -->
        <aside class="w-64 bg-gray-900 p-4 overflow-auto min-h-0">
          members panel or show person info
        </aside>
      </section>
    </main>
  </div>
</ui:composition>
