<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

  <h:panelGroup
    id="blockListPanel"
    layout="block"
    styleClass="h-full min-h-0 flex flex-col bg-gray-950 text-gray-100">
    <f:event type="preRenderComponent" listener="#{blockedUsers.loadBlockedUsers}" />
    <!-- Header -->
    <div class="shrink-0 border-b border-gray-800 px-5 py-4">
      <h2 class="text-lg font-semibold">Blocked Users</h2>
      <p class="text-sm text-gray-400">Manage users you have blocked.</p>
    </div>

    <!-- Add blocked user form -->
    <div class="shrink-0 px-5 py-4 border-b border-gray-800">
      <h:form styleClass="flex gap-2">
        <h:inputText
          value="#{blockedUsers.userToBlock}"
          styleClass="flex-1 rounded-md bg-gray-900 border border-gray-700 px-3 py-2 text-sm text-gray-100 outline-none focus:border-indigo-500"
          placeholder="Enter username to block" />

        <h:commandButton
          value="Block"
          action="#{blockedUsers.blockThisUser}"
          styleClass="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700">
          <f:ajax execute="@form" render="blockListPanel" />
        </h:commandButton>
      </h:form>
    </div>

    <!-- Actions -->
    <div class="shrink-0 px-5 py-3 border-b border-gray-800">
      <h:form>
        <h:commandButton
          value="Refresh List"
          action="#{blockedUsers.loadBlockedUsers}"
          styleClass="rounded-md bg-gray-800 px-4 py-2 text-sm text-gray-200 hover:bg-gray-700">
          <f:ajax execute="@this" render="blockedList blockMessagePanel" />
        </h:commandButton>
      </h:form>
    </div>

    <!-- Message -->
    <h:panelGroup id="blockMessagePanel" layout="block" styleClass="px-5 pt-3">
      <h:outputText
        value="#{blockedUsers.message}"
        rendered="#{not empty blockedUsers.message}"
        styleClass="text-sm text-red-400" />
    </h:panelGroup>

    <!-- Blocked users list -->
    <h:panelGroup
      id="blockedList"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-2">

      <h:panelGroup
        rendered="#{empty blockedUsers.blockedUsers}"
        layout="block"
        styleClass="rounded-lg border border-dashed border-gray-700 p-6 text-center text-sm text-gray-400">
        No blocked users yet.
      </h:panelGroup>

      <ui:repeat value="#{blockedUsers.blockedUsers}" var="user">
        <div class="flex items-center justify-between rounded-lg bg-gray-900 border border-gray-800 px-4 py-3 hover:bg-gray-800">
          <div class="min-w-0">
            <p class="truncate text-sm font-medium text-gray-100">
              #{user.username}
            </p>
            <p class="text-xs text-gray-500">
              Blocked user
            </p>
          </div>
        </div>
      </ui:repeat>

    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
