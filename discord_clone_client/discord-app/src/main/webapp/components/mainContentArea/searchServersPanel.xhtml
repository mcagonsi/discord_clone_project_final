<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:panelGroup
    id="serverSearchPanel"
    layout="block"
    styleClass="h-full min-h-0 flex flex-col bg-gray-950 text-gray-100"
  >
    <div class="shrink-0 border-b border-gray-800 px-5 py-4">
      <h2 class="text-lg font-semibold">Server Search</h2>
      <p class="text-sm text-gray-400">Search for public servers.</p>
    </div>
    <div class="shrink-0 px-5 py-4 border-b border-gray-800">
      <h:form styleClass="flex gap-2">
        <h:inputText
          value="#{serverBean.searchQuery}"
          styleClass="flex-1 rounded-md bg-gray-900 border border-gray-700 px-3 py-2 text-sm text-gray-100 outline-none focus:border-indigo-500"
          placeholder="Enter server name to search"
        />

        <h:commandButton
          value="Search"
          action="#{serverBean.searchPublicServers}"
          styleClass="bg-blue-700 hover:bg-blue-600 text-white px-4 py-2 rounded transition"
        >
          <f:ajax
            execute="@form"
            render="serversList serverSearchMessagePanel"
          />
        </h:commandButton>
      </h:form>
    </div>
    <h:panelGroup
      id="serverSearchMessagePanel"
      layout="block"
      styleClass="px-5 pt-3"
    >
      <h:outputText
        value="#{serverBean.message}"
        rendered="#{not empty serverBean.message}"
        placeholder="Please enter name or description to search"
        styleClass="text-sm text-red-400"
      />
    </h:panelGroup>
    <h:panelGroup
      id="serversList"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-2"
    >
      <h:panelGroup
        rendered="#{empty serverBean.serversSearchResult}"
        layout="block"
        styleClass="rounded-lg border border-dashed border-gray-700 p-6 text-center text-sm text-gray-400"
      >
        No server found
      </h:panelGroup>

      <ui:repeat value="#{serverBean.serversSearchResult}" var="server">
        <div
          class="flex items-center justify-between rounded-lg bg-gray-900 border border-gray-800 px-4 py-3 hover:bg-gray-800 transition"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-gray-100">
                #{server.name}
              </p>
              <p class="text-xs text-gray-500">#{server.description}</p>
            </div>
          </div>
       
          <h:form id="joinServerForm">
            <ui:repeat value="#{serverBean.serversSearchResult}" var="server">
              <h:commandButton
                value="Join Server"
                action="#{serverBean.joinServer(server)}"
                styleClass="text-xs bg-blue-700 hover:bg-blue-600 text-white px-2 py-1 rounded transition"
              >
                <f:ajax
                  execute="@form"
                  render="serversList serverSearchMessagePanel :serverRail"
                />
              </h:commandButton>
            </ui:repeat>
          </h:form>
        </div>
      </ui:repeat>
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
