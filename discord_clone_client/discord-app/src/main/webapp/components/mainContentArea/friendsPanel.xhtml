<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:panelGroup
    id="friendsListPanel"
    layout="block"
    styleClass="h-full min-h-0 flex flex-col text-xs bg-gray-950 text-gray-100"
  >
    <f:event
      type="preRenderComponent"
      listener="#{userFriendsBean.loadFriendsList}"
    />
    <div class="w-full flex flex-row justify-between items-center">
      <div class="shrink-0 border-b border-gray-800 px-5 py-4 w-[50%]">
        <h2 class="text-lg font-semibold">Friends List</h2>
        <p class="text-sm text-gray-400">See the Friends you have.</p>
      </div>
      <div class="shrink-0 px-5 py-2 w-[50%]">
        <h:form>
          <h:commandButton
            value="Refresh List"
            action="#{userFriendsBean.loadFriendsList}"
            styleClass="rounded-md bg-gray-800 px-4 py-2 text-sm text-gray-200 hover:bg-gray-700"
          >
            <f:ajax execute="@this" render="friendsList friendsMessagePanel" />
          </h:commandButton>
        </h:form>
      </div>
    </div>

    <section
      class="shrink-0 flex-row text-xs flex px-2 border-b border-gray-800"
    >
      <div class="shrink-0 px-5 py-2 w-[50%]">
        <h:form styleClass="flex gap-2">
          <h:inputText
            value="#{directChatBean.userToDM}"
            styleClass="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            title="Enter username to send a DM"
          />

          <h:commandButton
            value="Send DM"
            action="#{directChatBean.dmUserbyUsername}"
            styleClass="rounded-md bg-red-600 px-4 py-2 w-fit font-medium text-white hover:bg-red-700"
          >
            <f:ajax execute="@form" render=":sideNav :mainContentPanel" />
          </h:commandButton>
          <h:outputText
            value="#{directChatBean.message}"
            rendered="#{not empty directChatBean.message}"
            styleClass="text-sm text-red-400"
          />
        </h:form>
      </div>
      <div class="shrink-0 px-5 py-2 w-[50%]">
        <h:form styleClass="flex gap-2">
          <h:inputText
            value="#{userFriendsBean.username}"
            styleClass="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg text-white placeholder-gray-400 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition"
            title="Enter username to send friend request"
          />

          <h:commandButton
            value="Send Friend Request"
            action="#{userFriendsBean.sendFriendRequest}"
            styleClass="rounded-md bg-red-600 px-4 py-2 w-fit font-medium text-white hover:bg-red-700"
          >
            <f:ajax execute="@form" render="friendsListPanel" />
          </h:commandButton>
        </h:form>
      </div>
    </section>

    <h:panelGroup
      id="friendsMessagePanel"
      layout="block"
      styleClass="px-5 pt-3"
    >
      <h:outputText
        value="#{userFriendsBean.message}"
        rendered="#{not empty userFriendsBean.message}"
        styleClass="text-sm text-red-400"
      />
    </h:panelGroup>
    <h:panelGroup
      id="friendsList"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-2"
    >
      <h:panelGroup
        rendered="#{empty userFriendsBean.friends}"
        layout="block"
        styleClass="rounded-lg border border-dashed border-gray-700 p-6 text-center text-sm text-gray-400"
      >
        No friends yet.
      </h:panelGroup>

      <ui:repeat value="#{userFriendsBean.friends}" var="user">
        <div
          class="flex items-center justify-between rounded-lg bg-gray-900 border border-gray-800 px-4 py-3 hover:bg-gray-800 transition"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-gray-100">
                #{user.display_name} #{user.username}
              </p>
              <p class="text-xs text-gray-500 flex items-center gap-1">
                <span
                  class="w-2 h-2 rounded-full #{user.status == 'online' ? 'bg-green-500' : user.status == 'idle' ? 'bg-yellow-500' : 'bg-gray-500'}"
                ></span>
                #{user.status}
              </p>
            </div>
          </div>
          <!-- Send message button -->
          <h:form>
            <h:commandButton
              value="Send Message"
              action="#{directChatBean.dmFromFriendList(user.username)}"
              styleClass="text-xs bg-blue-700 hover:bg-blue-600 text-white px-2 py-1 rounded transition"
            >
              <!-- <f:ajax execute="@this" render=":sideNav :mainContentPanel" /> -->
            </h:commandButton>
          </h:form>
        </div>
      </ui:repeat>
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
