<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:panelGroup
    id="friendsListPanel"
    layout="block"
    styleClass="h-full min-h-0 flex flex-col bg-gray-950 text-gray-100"
  >
    <f:event
      type="preRenderComponent"
      listener="#{userFriendsBean.loadFriendsList}"
    />

    <div class="shrink-0 border-b border-gray-800 px-5 py-4">
      <h2 class="text-lg font-semibold">Friends List</h2>
      <p class="text-sm text-gray-400">See the Friends you have.</p>
    </div>
    <div class="shrink-0 px-5 py-4 border-b border-gray-800">
      <h:form styleClass="flex gap-2">
        <h:inputText
          value="#{userFriendsBean.username}"
          styleClass="flex-1 rounded-md bg-gray-900 border border-gray-700 px-3 py-2 text-sm text-gray-100 outline-none focus:border-indigo-500"
          placeholder="Enter username to add as friend"
        />

        <h:commandButton
          value="Add Friend"
          action="#{userFriendsBean.sendFriendRequest}"
          styleClass="rounded-md bg-red-600 px-4 py-2 text-sm font-medium text-white hover:bg-red-700"
        >
          <f:ajax execute="@form" render="friendsListPanel" />
        </h:commandButton>
      </h:form>
    </div>
    <div class="shrink-0 px-5 py-3 border-b border-gray-800">
      <h:form>
        <h:commandButton
          value="Refresh List"
          action="#{userFriendsBean.loadFriendsList}"
          styleClass="rounded-md bg-gray-800 px-4 py-2 text-sm text-gray-200 hover:bg-gray-700"
        >
          <f:ajax execute="@this" render="friendsList friendsMessagePanel" />
        </h:commandButton>
      </h:form>
    </div>
    <h:panelGroup
      id="friendsMessagePanel"
      layout="block"
      styleClass="px-5 pt-3"
    >
      <h:outputText
        value="#{userFriendsBean.message}"
        rendered="#{not empty userFriendsBean.message}"
        styleClass="text-sm text-red-400"
      />
    </h:panelGroup>
    <h:panelGroup
      id="friendsList"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-2"
    >
      <h:panelGroup
        rendered="#{empty userFriendsBean.friends}"
        layout="block"
        styleClass="rounded-lg border border-dashed border-gray-700 p-6 text-center text-sm text-gray-400"
      >
        No friends yet.
      </h:panelGroup>

      <ui:repeat value="#{userFriendsBean.friends}" var="user">
        <div class="flex items-center justify-between rounded-lg bg-gray-900 border border-gray-800 px-4 py-3 hover:bg-gray-800 transition">
          <div class="flex items-center gap-3 min-w-0">
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-gray-100">#{user.display_name}</p>
              <p class="text-xs text-gray-500 flex items-center gap-1">
             
                <span class="w-2 h-2 rounded-full #{user.status == 'online' ? 'bg-green-500' : user.status == 'idle' ? 'bg-yellow-500' : 'bg-gray-500'}"></span>
                #{user.status}
              </p>
            </div>
          </div>
          <!-- Send message button -->
          <!-- <h:commandButton
            value="Send Message"
          
            styleClass="text-xs bg-blue-700 hover:bg-blue-600 text-white px-2 py-1 rounded transition">
            <f:ajax execute="@this" render="friendsList friendsMessagePanel" />
          </h:commandButton> -->
        </div>
      </ui:repeat>
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
