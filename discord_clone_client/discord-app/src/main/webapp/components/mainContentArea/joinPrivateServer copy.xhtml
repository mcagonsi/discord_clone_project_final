<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:panelGroup
    id="JoinPrivateServerPanel"
    layout="block"
    styleClass="h-full min-h-0 flex flex-col bg-gray-950 text-gray-100"
  >
    <div class="shrink-0 border-b border-gray-800 px-5 py-4">
      <h2 class="text-lg font-semibold">Join a Private Server</h2>
      <p class="text-sm text-gray-400">Paste the invite link sent to you. You must be invited by a server member to join.</p>
    </div>
    <div class="shrink-0 px-5 py-4 border-b border-gray-800">
      <h:form styleClass="flex gap-2">
        <h:inputText
          value="#{serverBean.inviteLink}"
          styleClass="flex-1 rounded-md bg-gray-900 border border-gray-700 px-3 py-2 text-sm text-gray-100 outline-none focus:border-indigo-500"
          placeholder="Enter invite link"
        />

        <h:commandButton
          value="Join Server"
          action="#{serverBean.getServerInfo}"
          styleClass="bg-blue-700 hover:bg-blue-600 text-white px-4 py-2 rounded transition"
        >
          <f:ajax
            execute="@form"
            render="serverInfoDetails joinPrivateServerMessagePanel"
          />
        </h:commandButton>
        <!-- <h:commandButton
          value="Clear Search Results"
          action="#{serverBean.clearSearchResults}"
          styleClass="bg-indigo-700 hover:bg-indigo-400 text-white px-4 py-2 rounded transition"
        >
          <f:ajax
            execute="@form"
            render="serverInfoDetails joinPrivateServerMessagePanel"
          />
        </h:commandButton> -->
      </h:form>
    </div>
    <h:panelGroup
      id="joinPrivateServerMessagePanel"
      layout="block"
      styleClass="px-5 pt-3"
    >
      <h:outputText
        value="#{serverBean.message}"
        rendered="#{not empty serverBean.message}"
        placeholder="Please enter name or description to search"
        styleClass="text-sm text-red-400"
      />
    </h:panelGroup>
    <h:panelGroup
      id="serverInfoDetails"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-y-auto px-5 py-4 space-y-2"
    >
      <h:panelGroup
        rendered="#{serverBean.privateServer == null}"
        layout="block"
        styleClass="rounded-lg border border-dashed border-gray-700 p-6 text-center text-sm text-gray-400"
      >
        <p>Invalid Invite Code</p>
      </h:panelGroup>

     
        <div
          class="flex items-center justify-between rounded-lg bg-gray-900 border border-gray-800 px-4 py-3 hover:bg-gray-800 transition"
        >
          <div class="flex items-center gap-3 min-w-0">
            <div class="min-w-0">
              <p class="truncate text-sm font-medium text-gray-100">
                #{serverBean.privateServer.name}
              </p>
              <p class="text-xs text-gray-500">#{serverBean.privateServer.description}</p>
            </div>
          </div>

          <h:form id="joinServerForm">
            <h:commandButton
              value="Join Server"
              action="#{serverBean.joinServer(serverBean.privateServer)}"
              styleClass="text-xs bg-blue-700 hover:bg-blue-600 text-white px-2 py-1 rounded transition"
            >
              <f:ajax
                execute="@form"
                render="serversList joinPrivateServerMessagePanel :serverRail"
              />
            </h:commandButton>
          </h:form>
        </div>
      
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
