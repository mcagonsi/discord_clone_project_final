<ui:composition
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:panelGroup id="mainContentPanel" styleClass="flex-1 min-h-0 flex flex-col">
    <h:panelGroup
      id="chatPanel"
      layout="block"
      styleClass="flex-1 min-h-0 flex flex-col"
      rendered="#{dashboardNavigation.mainContentPanel == 'chatPanel'}"
    >
      <ui:include src="chatPanel.xhtml" />
    </h:panelGroup>

    <h:panelGroup
      id="blockUserPanel"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-auto"
      rendered="#{dashboardNavigation.mainContentPanel == 'blockPanel'}"
    >
      <ui:include src="BlockPanel.xhtml" />
    </h:panelGroup>

    <h:panelGroup
      id="createServerViewPanel"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-auto"
      rendered="#{dashboardNavigation.mainContentPanel == 'createServerPanel'}"
    >
      <ui:include src="createServerPanel.xhtml" />
    </h:panelGroup>

    <h:panelGroup
      id="JoinPrivateServerPanel"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-auto"
      rendered="#{dashboardNavigation.mainContentPanel == 'joinServerPanel'}"
    >
      <p>Join Private Server</p>
    </h:panelGroup>

    <h:panelGroup
      id="searchServerPanel"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-auto"
      rendered="#{dashboardNavigation.mainContentPanel == 'searchServersPanel'}"
    >
      <ui:include src="searchServersPanel.xhtml" />
    </h:panelGroup>

    <h:panelGroup
      id="friendsViewPanel"
      layout="block"
      styleClass="flex-1 min-h-0 overflow-auto"
      rendered="#{dashboardNavigation.mainContentPanel == 'friendsPanel'}"
    >
    
      <ui:include src="friendsPanel.xhtml" />
    
      
    </h:panelGroup>
  </h:panelGroup>
</ui:composition>
