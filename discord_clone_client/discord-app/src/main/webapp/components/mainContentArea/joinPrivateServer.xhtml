<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
<h:panelGroup
    id="privateServerJoinUnique"
    layout="block"
    styleClass="h-full min-h-0 flex flex-col bg-gray-950 text-gray-100"
  >
    <div class="shrink-0 border-b border-gray-800 px-5 py-4">
      <h2 class="text-lg font-semibold">Join a Private Server</h2>
      <p class="text-sm text-gray-400">
        Paste the invite link sent to you. You must be invited by a server
        member to join.
      </p>
    </div>
    <div class="shrink-0 px-5 py-4 border-b border-gray-800">
      <h:form styleClass="flex gap-2">
        <h:inputText
          value="#{serverBean.inviteLink}"
          styleClass="flex-1 rounded-md bg-gray-900 border border-gray-700 px-3 py-2 text-sm text-gray-100 outline-none focus:border-indigo-500"
          placeholder="Enter invite link"
        />

        <h:commandButton
          value="Join Server"
          action="#{serverBean.fetchServerInfo}"
          styleClass="bg-blue-700 hover:bg-blue-600 text-white px-4 py-2 rounded transition"
        >
        </h:commandButton>
      
      </h:form>
    </div>
</h:panelGroup>
</ui:composition>
