<?xml version="1.0" encoding="UTF-8"?>
<ui:composition
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <f:event
    type="preRenderComponent"
    listener="#{serverChatBean.loadChannelMessages}"
  />

  <h:panelGroup
    id="serverChatPanelView"
    layout="block"
    styleClass="flex-1 min-h-0 w-full text-xs overflow-y-auto px-4 py-4 space-y-4"
  >
    <ui:repeat value="#{serverChatBean.serverChannelMessages}" var="message">
      <div class="flex items-start gap-3">
        <div>
          <div class="flex items-center gap-2">
            <span class="font-semibold text-gray-300">
              @#{serverChatBean.getUserFromId(message.authorId).username}
            </span>
            <span class="text-xs text-gray-500">#{message.createdAt}</span>
          </div>
          <p class="text-sm text-gray-200 mt-1">#{message.content}</p>
        </div>
        <h:form>
          <h:commandButton
            value="🗑"
            action="#{serverChatBean.deleteMessage(message.id)}"
            title="Delete message"
            rendered="#{serverChatBean.sessionedUser.id == message.authorId}"
            styleClass="w-7 h-7 p-0 flex items-center justify-center bg-transparent hover:bg-red-600 text-red-400 hover:text-white rounded-md"
          >
            <f:ajax execute="@this" render="serverChatPanelView" />
          </h:commandButton>
        </h:form>
      </div>
    </ui:repeat>
  </h:panelGroup>

  <div
    id="schatInputContainer"
    class="shrink-0 w-full border-t border-gray-800 bg-black"
  >
    <ui:include src="/components/ui/serverChatInput.xhtml" />
  </div>
</ui:composition>
