<!DOCTYPE html>
<html
  lang="en"
  class="h-full"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:h="http://xmlns.jcp.org/jsf/html"
  xmlns:f="http://xmlns.jcp.org/jsf/core"
  xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>
  <h:head>
    <title>Discord Juggernaut App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <h:outputStylesheet library="css" name="theme.css" />
    <f:viewAction action="#{authBean.checkLoginStatus}" />
  </h:head>

  <h:body class="h-full flex flex-col bg-black m-0">
    
    <header class="w-full h-12 border-b border-gray-800 bg-transparent z-20 shrink-0">
      <ui:include src="../components/me/titleBar.xhtml" />
    </header>

    <main class="bg-green-500 flex-1 min-h-0 overflow-hidden flex">
      <ui:include src="../components/me/DashboardLayout.xhtml" />
    </main>
  </h:body>
</html>
