<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Discord Clone Project</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

    </h:head>
    <h:body styleClass="min-h-screen bg-gradient-to-br from-[#000000] to-[#330000]">
        <div class="flex items-center justify-center">
            <h1 class="text-white">Welcome to Team Juggernaut's Discord Clone Project. This is the main page.</h1>
        </div>
        <div class="relative min-h-screen">
            <h:panelGroup styleClass="fixed top-4 left-4 z-20">
                <ui:include src="/WEB-INF/includes/main_user_menu.xhtml" />
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="#{checkButtonToggleBean.activePanel eq 'create' ? 'block flex items-center justify-center mt-40' : 'hidden'}">
                <ui:include src="/WEB-INF/includes/create_server.xhtml" />
            </h:panelGroup>
            <div class="min-h-[40vh] flex items-center justify-center py-8">
                <h:panelGroup layout="block" styleClass="#{checkButtonToggleBean.activePanel eq 'DMs' ? 'block max-w-3xl mx-auto px-4' : 'hidden'}">
                    <ui:include src="/WEB-INF/includes/direct_message_menu.xhtml" />
                </h:panelGroup>
            </div>
            <h:panelGroup layout="block" styleClass="#{checkButtonToggleBean.activePanel eq 'currentServer' ? 'block fixed top-8 left-[12rem] text-white bg-white/20 backdrop-blur-md border border-white/30 text-white my-2 px-4 py-1 inline-flex items-center justify-center max-w-[400px]' : 'hidden'}">
                <ui:include src="/WEB-INF/includes/base_server_ui.xhtml" />
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="#{checkButtonToggleBean.activePanel eq 'servers' ? 'block fixed top-8 left-[12rem]' : 'hidden'}">
                <ui:include src="/WEB-INF/includes/server_list.xhtml" />
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="text-white text-shadow-md text-shadow-black">
                <ui:include src="/WEB-INF/includes/user_profile.xhtml" />
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="#{checkButtonToggleBean.activePanel eq 'joinThisServer' ? 'block flex items-center justify-center' : 'hidden'}">
                <ui:include src="/WEB-INF/includes/join_server.xhtml" />
            </h:panelGroup>
       </div>
    </h:body>
</html>
