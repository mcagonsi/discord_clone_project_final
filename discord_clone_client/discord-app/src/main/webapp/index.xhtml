<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Discord Clone Project</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>

    </h:head>
    <h:body styleClass="min-h-screen bg-gradient-to-br from-[#5b209a] to-[#000000]">
        <div class="relative min-h-screen">
            <div class="fixed top-4 left-4 z-20">
                <ui:include src="/WEB-INF/includes/main_user_menu.xhtml" />
            </div>
            <h:panelGroup styleClass="pt-20 flex items-center justify-center">
                <ui:include src="/WEB-INF/includes/create_server.xhtml" />
            </h:panelGroup>
            <!--Gonna need to make the toggle function to check which button is active to properly test the menu buttons-->
            <div class="min-h-[40vh] flex items-center justify-center py-8">
                <div class="w-full max-w-3xl mx-auto px-4">
                    <ui:include src="/WEB-INF/includes/direct_message_menu.xhtml" />
                    <div class="border border-gray-200 shadow-sm rounded-lg p-6 text-white">
                        <ui:include src="/WEB-INF/includes/server_list.xhtml" />
                        <h:outputText value="Welcome to the Groups and Friends page!" styleClass="text-2xl text-white font-semibold block" />
                        <h:outputText value="Manage your groups, friends, and permissions from here." styleClass="mt-2 text-sm text-white block" />
                    </div>
                </div>
            </div>
        <h:form>
            <h:commandButton styleClass="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" value="Fetch Permissions" action="#{permissionBean.getPermissions}" />
        </h:form>
       </div>
    </h:body>
</html>
