<ui:composition
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
        <title>Basic Server Creation Menu</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>


        <h:panelGroup id="createServer" layout="block">
          <h:form>
            <div class="mr-10">
                <h1 class="text-white flex justify-center">Create Servers</h1>
                <p class="text-white">Actually this could probably be a single form with the option to make it public or private instead of 2 forms</p>
            </div>
          </h:form>
          <h:form styleClass="flex items-center justify-center pr-10 gap-3">
            <h:commandButton value="Create Public Server" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white px-2 py-1 inline-flex items-center justify-center hover:cursor-pointer whitespace-nowrap" />
            <h:commandButton value="Create Private Server" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white px-2 py-1 inline-flex items-center justify-center hover:cursor-pointer whitespace-nowrap"/>
          </h:form>
        </h:panelGroup>
</ui:composition>
