<ui:composition
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
        <title>Basic Direct Message Menu</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>


        <h:panelGroup id="directMessages" layout="block" styleClass="fixed top-5 left-15">
          <h:form>
              <h1 class="text-white">Direct Messaging</h1>
              <h:outputLabel for="UIDInput" styleClass="pr-1 text-white">
                <h:outputText styleClass="text-white" id="UIDInput" value="Enter User ID: " />
              </h:outputLabel>
              <h:inputText value="" styleClass="rounded-md mr-2 text-black" />
              <h:commandButton value="Load Messages" styleClass="bg-[#5865F2] hover:bg-[#4752C4] text-white rounded-md my-2 px-2 py-1 inline-flex items-center justify-center max-w-[150px] pl-1"/>
          </h:form>
        </h:panelGroup>
</ui:composition>
