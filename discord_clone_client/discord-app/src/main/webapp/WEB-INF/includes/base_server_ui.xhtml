<ui:composition
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
        <title>Basic Direct Message Menu</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>


        <h:panelGroup id="baseServerUI">
            <h:form styleClass="flex grid items-center justify-center">
                  <h1 class="text-white border border-white/30 text-white my-2 px-4 py-1 inline-flex items-center justify-center 
                  max-w-[400px]">*Server Name Here*</h1>
                  <h2 class="mt-2 text-white border border-white/30 text-white my-2 px-4 py-1 inline-flex items-center justify-center 
                  max-w-[200px] ml-[5rem]">Text Channels</h2>
                  
                  <h:commandButton value="+" styleClass="bg-white/20 backdrop-blur-md 
                  border border-white/30 hover:bg-white/10 text-white inline-flex items-center 
                  justify-center hover:cursor-pointer h-8 w-14 transition-colors duration-150" />
            </h:form>
        </h:panelGroup>
</ui:composition>
