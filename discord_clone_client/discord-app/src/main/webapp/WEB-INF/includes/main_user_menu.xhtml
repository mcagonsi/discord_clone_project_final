<ui:composition
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
        <title>Basic User Menu</title>
        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>


        <h:panelGroup id="menu" layout="block" styleClass="pl-3">
            <h:form>
                <h:commandButton value="Main Page" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white  my-2 px-4 py-2 inline-flex items-center justify-center grid grid-cols-1 max-w-[150px] w-full hover:cursor-pointer"/>

                <h:commandButton value="View Friends List" action="#{checkButtonToggleBean.showDMs}" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white  my-2 px-4 py-2 inline-flex items-center justify-center grid grid-cols-1 max-w-[150px] w-full hover:cursor-pointer"/>

                <h:commandButton value="View Server List" action="#{checkButtonToggleBean.showServers}" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white  my-2 px-4 py-2 inline-flex items-center justify-center grid grid-cols-1 max-w-[150px] w-full hover:cursor-pointer"/>

                <h:commandButton value="Join Server" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white my-2 px-4 py-2 inline-flex items-center justify-center grid grid-cols-1 max-w-[150px] w-full hover:cursor-pointer" />

                <h:commandButton value="Create Server" action="#{checkButtonToggleBean.showCreate}" styleClass="bg-white/20 backdrop-blur-md border border-white/30 hover:bg-white/10 text-white  my-2 px-4 py-2 inline-flex items-center justify-center grid grid-cols-1 max-w-[150px] w-full hover:cursor-pointer" />
            </h:form>
        </h:panelGroup>

</ui:composition>
